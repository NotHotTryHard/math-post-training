[project]
name = "math-post-training"
version = "0.1.0"
description = "SFT and RL post-training experiments for language models on math problems"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.0,<6",
    "pyyaml>=6.0,<7",
    "torch>=2.11,<2.12",
    "transformers>=5.14,<6",
]

[project.scripts]
model-generate = "math_post_training.cli:generate_main"
model-eval = "math_post_training.cli:eval_main"
model-sft = "math_post_training.cli:sft_main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "math-verify[antlr4-13-2]>=0.9,<1",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]
eval = [
    "math-verify[antlr4-13-2]>=0.9,<1",
    "tqdm>=4.67,<5",
    "wandb>=0.28,<0.29",
]
train = [
    "accelerate>=1.14,<2",
    "peft>=0.19,<0.20",
    "trl>=1.9,<2",
    "wandb>=0.28,<0.29",
]
vllm = [
    "flashinfer-cubin==0.6.14; sys_platform == 'linux'",
    "vllm==0.26.0; sys_platform == 'linux'",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl"
explicit = true

[tool.uv.sources]
flashinfer-cubin = { index = "flashinfer" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
