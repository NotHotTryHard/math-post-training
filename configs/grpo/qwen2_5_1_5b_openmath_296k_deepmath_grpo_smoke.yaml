experiment:
  name: qwen2.5-1.5b-openmath-296k-native-eos-deepmath-grpo-smoke

model:
  name_or_path: NotHotTryHard/qwen2.5-1.5b-base-openmath-296k-1epoch-lora-cosine-native-eos-merged
  dtype: auto
  trust_remote_code: false

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: all-linear
  bias: none
  task_type: CAUSAL_LM

dataset:
  validation:
    size: 100
    seed: 42
    shuffle_buffer_size: 10_000
  sources:
    - adapter: deepmath
      path: zwhe99/DeepMath-103K
      subset: null
      revision: 5cf055d1fe3d7a2eb19719ac020211469736ae44
      split: train
      streaming: true
      shuffle_seed: 42
      shuffle_buffer_size: 10_000
      limit: 1_000

grpo:
  output_dir: /workspace/outputs/grpo/qwen2.5-1.5b-openmath-296k-native-eos-deepmath-grpo-smoke
  max_steps: 10
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 5.0e-6
  max_completion_length: 2048
  num_generations: 8
  temperature: 0.8
  top_p: 0.95
  loss_type: dapo
  scale_rewards: group
  reward_weights: [1.0, 0.1]
  mask_truncated_completions: true
  beta: 0.0
  disable_dropout: true
  use_vllm: true
  vllm_mode: colocate
  vllm_tensor_parallel_size: 1
  vllm_gpu_memory_utilization: 0.3
  vllm_enable_sleep_mode: true
  vllm_max_model_length: 4096
  bf16: true
  tf32: true
  gradient_checkpointing: false
  logging_steps: 1
  log_completions: true
  save_strategy: steps
  save_steps: 5
  save_total_limit: 2
  report_to: wandb
  seed: 42
