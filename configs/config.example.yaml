experiment:
  name: qwen2.5-1.5b-grpo-mixed-math-2024-smoke
  seed: 42

model:
  name_or_path: Qwen/Qwen2.5-1.5B-Instruct
  dtype: auto
  trust_remote_code: false

dataset:
  seed: 42
  stopping_strategy: all_exhausted_without_replacement
  sources:
    - adapter: open_math_instruct_2
      path: nvidia/OpenMathInstruct-2
      subset: null
      revision: 469216e3f46f4dacf476b382e192485ea51a143e
      split: train_1M
      streaming: true
      shuffle_seed: 42
      shuffle_buffer_size: 10_000
      limit: 900
      probability: 0.9

    - adapter: gsm8k
      path: openai/gsm8k
      subset: main
      revision: e53f048856ff4f594e959d75785d2c2d37b678ee
      split: train
      streaming: true
      shuffle_seed: 42
      shuffle_buffer_size: 10_000
      limit: 100
      probability: 0.1

prompt:
  system: >-
    Solve the problem step by step. Put the final answer after ####.
  answer_delimiter: "####"
  use_chat_template: true

generation:
  backend: transformers
  max_new_tokens: 256
  num_return_sequences: 4
  do_sample: true
  temperature: 0.8
  top_p: 0.95
  seed: 42

training:
  algorithm: grpo
  output_dir: outputs/qwen2.5-1.5b-grpo-mixed-math-2024-smoke
  max_steps: 10
  learning_rate: 1.0e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  max_completion_length: 256
  num_generations: 4
  logging_steps: 1
  save_strategy: "no"
  use_vllm: false

evaluation:
  backend: transformers
  # Official Qwen2.5-Math zero-shot CoT prompt for Instruct checkpoints.
  # Use qwen2_5_math_base with Qwen/Qwen2.5-1.5B to reproduce the paper's
  # fixed 8-shot GSM8K, 4-shot MATH and 5-shot GaoKao Base protocol.
  protocol: qwen2_5_math_instruct
  output_dir: outputs/evaluations
  sample_seed: 42
  shuffle_buffer_size: 10_000
  batch_size: 4
  save_predictions: true
  generation:
    max_new_tokens: 2048
    num_return_sequences: 1
    do_sample: false
    temperature: 0.0
    top_p: 1.0
    seed: 42
  benchmarks:
    - name: gsm8k
      adapter: gsm8k
      path: openai/gsm8k
      subset: main
      revision: 740312add88f781978c0658806c59bc2815b9866
      split: test
      streaming: true

    - name: gsm1k
      adapter: gsm1k
      path: ScaleAI/gsm1k
      subset: null
      revision: bc09569d09a614b9b530edc7f076fb214ac10493
      split: test
      streaming: true

    - name: math
      adapter: hendrycks_math
      path: EleutherAI/hendrycks_math
      subsets:
        - algebra
        - counting_and_probability
        - geometry
        - intermediate_algebra
        - number_theory
        - prealgebra
        - precalculus
      revision: 21a5633873b6a120296cce3e2df9d5550074f4a3
      split: test
      streaming: true

    - name: gaokao_math_cloze
      adapter: gaokao_math_cloze
      path: RUCAIBox/agieval
      subset: gaokao-mathcloze
      revision: bbbf8d5d1428b22efc42e3b51f797fb4d139180c
      split: test
      streaming: true
      multiple_answers: true

tracking:
  report_to: wandb
  log_completions: true
